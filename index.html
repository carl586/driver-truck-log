<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Driver & Truck Log</title>
<style>
  :root {
    --bg: #ffffff;
    --line: #e7e9ec;
    --line-soft: #f0f1f3;
    --text: #14171a;
    --text-dim: #6b7280;
    --text-faint: #9aa1a9;
    --row-hover: #fafafa;
    --header-bg: #f9fafb;
    --red: #b91c1c; --red-bg: #fdecec; --red-bd: #f8d3d3;
    --green: #15803d; --green-bg: #e8f7ee; --green-bd: #cdeeda;
    --amber: #b45309; --amber-bg: #fef3e0; --amber-bd: #f7dfa8;
    --blue: #1d4ed8; --blue-bg: #eaf0fe; --blue-bd: #d3e0fc;
    --purple: #6d28d9; --purple-bg: #f3eefc; --purple-bd: #e0d4f7;
    --teal: #0f766e; --teal-bg: #e6f7f5; --teal-bd: #b8eae4;
    --orange: #c2410c; --orange-bg: #fff0e8; --orange-bd: #fdd5bf;
    --indigo: #4338ca; --indigo-bg: #eef0ff; --indigo-bd: #d4d8fc;
    --mono: 'SF Mono', 'JetBrains Mono', 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 24px 60px; }
  .top {
    display: flex; justify-content: space-between; align-items: flex-start;
    flex-wrap: wrap; gap: 16px; margin-bottom: 18px;
  }
  .top h1 { font-size: 1.35rem; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
  .top .sub { font-size: 0.82rem; color: var(--text-dim); }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .search-input, .filter-select {
    background: #fff; border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; font-size: 0.85rem; color: var(--text);
  }
  .search-input { min-width: 200px; }
  .search-input:focus, .filter-select:focus { outline: none; border-color: #b7bcc3; }
  .filter-select { min-width: 180px; cursor: pointer; }
  .form-card {
    border: 1px solid var(--line); border-radius: 12px; padding: 20px;
    margin-bottom: 18px; background: #fff;
  }
  .form-card h2 {
    font-size: 0.95rem; font-weight: 700; margin: 0 0 14px; color: var(--text);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .companies-link {
    font-size: 0.78rem; color: var(--text-faint); cursor: pointer;
    text-decoration: underline; font-weight: 400;
  }
  .status-select-wrap { margin-bottom: 18px; }
  .status-select-wrap label {
    display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 6px; font-weight: 600;
  }
  .status-select-wrap select {
    width: 100%; max-width: 380px; background: #fff; border: 2px solid var(--line);
    color: var(--text); padding: 12px 14px; border-radius: 10px; font-size: 0.95rem;
    font-weight: 600; cursor: pointer;
  }
  .status-select-wrap select:focus { outline: none; border-color: #14171a; }
  .form-group { margin-bottom: 12px; }
  .form-group label {
    display: block; font-size: 0.75rem; color: var(--text-dim); margin-bottom: 5px;
  }
  .form-group label .opt { color: var(--text-faint); font-weight: 400; }
  .form-group label .req { color: var(--red); }
  .form-group input[type=text],
  .form-group input[type=tel],
  .form-group input[type=date],
  .form-group select {
    width: 100%; background: #fff; border: 1px solid var(--line); color: var(--text);
    padding: 9px 12px; border-radius: 8px; font-size: 0.86rem; font-family: var(--sans);
  }
  .form-group input.mono { font-family: var(--mono); }
  .form-group input:focus, .form-group select:focus { outline: none; border-color: #b7bcc3; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-row.three { grid-template-columns: 1fr 1fr 1fr; }
  .fields-panel { display: none; }
  .fields-panel.active { display: block; }
  .company-wrap { display: flex; gap: 8px; align-items: flex-end; }
  .company-wrap select { flex: 1; }
  .btn-add-company {
    background: #fff; border: 1px solid var(--line); color: var(--text);
    padding: 9px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer;
    white-space: nowrap; height: 38px;
  }
  .btn-add-company:hover { background: #fafafa; }
  .companies-panel {
    display: none; margin-bottom: 16px; padding: 14px; border: 1px dashed var(--line);
    border-radius: 8px; background: #fafafa;
  }
  .companies-panel.open { display: block; }
  .companies-list { list-style: none; padding: 0; margin: 0 0 10px; }
  .companies-list li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 10px; border: 1px solid var(--line-soft); border-radius: 6px;
    margin-bottom: 6px; font-size: 0.85rem; background: #fff;
  }
  .companies-list li .del {
    background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 1rem;
  }
  .companies-list li .del:hover { color: var(--red); }
  .companies-empty { font-size: 0.82rem; color: var(--text-dim); margin-bottom: 10px; }
  .add-company-inline { display: flex; gap: 8px; align-items: center; }
  .add-company-inline input { flex: 1; }
  .btn-save-company {
    background: #14171a; color: #fff; border: none; border-radius: 8px;
    padding: 9px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
  }
  .form-actions {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px;
  }
  .btn-submit {
    background: #14171a; color: #fff; border: none; border-radius: 8px;
    padding: 10px 20px; font-size: 0.86rem; font-weight: 700; cursor: pointer;
  }
  .btn-submit:hover { background: #000; }
  .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-clear {
    background: #fff; border: 1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 8px; font-size: 0.86rem; cursor: pointer;
  }
  .btn-clear:hover { background: #fafafa; }
  .msg { font-size: 0.8rem; padding: 9px 11px; border-radius: 8px; display: none; }
  .msg.show { display: block; }
  .msg.ok { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-bd); }
  .msg.err { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-bd); }
  .table-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: var(--header-bg); text-align: left; font-size: 0.68rem;
    text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-faint);
    font-weight: 700; padding: 11px 16px; border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  tbody td {
    padding: 14px 16px; border-bottom: 1px solid var(--line-soft);
    font-size: 0.86rem; vertical-align: top;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--row-hover); }
  td.idx { color: var(--text-faint); font-size: 0.8rem; width: 36px; }
  .driver-cell .driver-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .driver-name { font-weight: 700; color: var(--text); }
  .driver-sub { color: var(--text-dim); font-size: 0.8rem; margin-top: 3px; line-height: 1.45; max-width: 420px; }
  .badge {
    display: inline-block; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; padding: 3px 8px; border-radius: 5px; border: 1px solid transparent;
    white-space: nowrap;
  }
  .badge.left { color: var(--red); background: var(--red-bg); border-color: var(--red-bd); }
  .badge.joined { color: var(--green); background: var(--green-bg); border-color: var(--green-bd); }
  .badge.switched { color: var(--amber); background: var(--amber-bg); border-color: var(--amber-bd); }
  .badge.returned { color: var(--blue); background: var(--blue-bg); border-color: var(--blue-bd); }
  .badge.newtruck { color: var(--teal); background: var(--teal-bg); border-color: var(--teal-bd); }
  .badge.switchedtruck { color: var(--purple); background: var(--purple-bg); border-color: var(--purple-bd); }
  .badge.lefttruck { color: var(--orange); background: var(--orange-bg); border-color: var(--orange-bd); }
  .badge.returnedtruck { color: var(--indigo); background: var(--indigo-bg); border-color: var(--indigo-bd); }
  td.truck { font-family: var(--mono); color: var(--text); font-size: 0.82rem; }
  td.company { color: var(--text); }
  td.date { color: var(--text); white-space: nowrap; }
  td.status-text { color: var(--text-dim); white-space: nowrap; }
  .del-btn {
    background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 1rem;
    padding: 4px 6px; line-height: 1;
  }
  .del-btn:hover { color: var(--red); }
  .empty-row td { text-align: center; color: var(--text-dim); padding: 40px 16px; }
  @media (max-width: 720px) {
    .form-row, .form-row.three { grid-template-columns: 1fr; }
    .company-wrap { flex-direction: column; align-items: stretch; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { border-bottom: 1px solid var(--line); padding: 12px 4px; }
    tbody td { border: none; padding: 3px 12px; }
    td.idx { display: none; }
    td.truck, td.company, td.date, td.status-text {
      display: inline-block; margin-right: 10px; font-size: 0.78rem; color: var(--text-dim);
    }
    td.truck::before { content: "Truck: "; color: var(--text-faint); }
    td.company::before { content: "Company: "; color: var(--text-faint); }
    .del-btn { float: right; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>Driver &amp; Truck Log</h1>
      <div class="sub" id="subCounts">0 updates</div>
    </div>
    <div class="controls">
      <input type="text" class="search-input" id="searchInput" placeholder="Search driver, truck, VIN, plate...">
      <select class="filter-select" id="filterSelect">
        <option value="all">All statuses</option>
        <optgroup label="Driver">
          <option value="joined">Joined Company</option>
          <option value="switched">Switched Company</option>
          <option value="left">Left Company</option>
          <option value="returned">Returned</option>
        </optgroup>
        <optgroup label="Truck">
          <option value="newtruck">New Truck</option>
          <option value="switchedtruck">Switched Truck</option>
          <option value="lefttruck">Left Truck</option>
          <option value="returnedtruck">Returned Truck</option>
        </optgroup>
      </select>
    </div>
  </div>

  <div class="form-card">
    <h2>
      Add update
      <span class="companies-link" id="companiesToggle">Manage companies</span>
    </h2>

    <div class="companies-panel" id="companiesPanel">
      <div class="companies-empty" id="companiesEmpty">No companies saved yet.</div>
      <ul class="companies-list" id="companiesList"></ul>
      <div class="add-company-inline">
        <input type="text" id="newCompanyInput" placeholder="New company name">
        <button class="btn-save-company" id="saveCompanyBtn">Add company</button>
      </div>
      <div class="msg" id="companiesMsg" style="margin-top:10px;"></div>
    </div>

    <div class="status-select-wrap">
      <label for="statusSelect">Status <span class="req">*</span></label>
      <select id="statusSelect">
        <option value="">— Select status —</option>
        <optgroup label="Driver">
          <option value="joined">#newdriver — Joined Company</option>
          <option value="switched">#switchdriver — Switched Company</option>
          <option value="left">#leftdriver — Left Company</option>
          <option
